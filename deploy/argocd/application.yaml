# GitOps: Argo CD keeps the cluster in sync with helm/sockrat on GitHub. Push a change to the
# chart or its values and Argo CD rolls it out; edit the cluster by hand and it puts it back.
#   kubectl apply -n argocd -f deploy/argocd/application.yaml
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sockrat
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io  # deleting the Application removes what it deployed
spec:
  project: default
  source:
    repoURL: https://github.com/radhikakumar0705/sockrat.git
    targetRevision: master
    path: helm/sockrat
    helm:
      releaseName: sockrat
      valueFiles:
        - values-kind.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: sockrat
  syncPolicy:
    automated:
      prune: true     # delete resources removed from the chart
      selfHeal: true  # undo manual changes in the cluster
    syncOptions:
      - CreateNamespace=true
      - RespectIgnoreDifferences=true  # keep the generated Secret's values (see below)
    retry:
      limit: 5
      backoff: { duration: 10s, factor: 2, maxDuration: 3m }
  # The chart keeps its generated Secret's values via `lookup`, which Argo CD can't run, so each
  # render has new random values: create the Secret once, then leave its data alone.
  ignoreDifferences:
    - kind: Secret
      name: sockrat-secrets
      jsonPointers: [/data]
