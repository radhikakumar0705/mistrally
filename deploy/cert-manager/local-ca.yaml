# A private certificate authority for local clusters, managed by cert-manager:
#   1. a self-signed issuer bootstraps a CA certificate,
#   2. the "sockrat-ca" ClusterIssuer signs app certificates with that CA.
# Trust the CA once (kubectl -n cert-manager get secret sockrat-ca -o jsonpath='{.data.ca\.crt}')
# and every certificate it issues is trusted, unlike one self-signed certificate per site.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: selfsigned
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: sockrat-ca
  namespace: cert-manager
spec:
  isCA: true
  commonName: sockRat local CA
  secretName: sockrat-ca
  duration: 8760h  # 1 year
  privateKey: { algorithm: ECDSA, size: 256 }
  issuerRef: { name: selfsigned, kind: ClusterIssuer, group: cert-manager.io }
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: sockrat-ca
spec:
  ca:
    secretName: sockrat-ca
