# A private certificate authority for local clusters, managed by cert-manager:
#   1. a self-signed issuer bootstraps a CA certificate,
#   2. the "mistrally-ca" ClusterIssuer signs app certificates with that CA.
# Trust the CA once (kubectl -n cert-manager get secret mistrally-ca -o jsonpath='{.data.ca\.crt}')
# and every certificate it issues is trusted, unlike one self-signed certificate per site.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: selfsigned
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: mistrally-ca
  namespace: cert-manager
spec:
  isCA: true
  commonName: Mistrally local CA
  secretName: mistrally-ca
  duration: 8760h  # 1 year
  privateKey: { algorithm: ECDSA, size: 256 }
  issuerRef: { name: selfsigned, kind: ClusterIssuer, group: cert-manager.io }
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: mistrally-ca
spec:
  ca:
    secretName: mistrally-ca
