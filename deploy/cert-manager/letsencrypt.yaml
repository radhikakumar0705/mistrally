# Let's Encrypt issuers for a cluster with a public domain (e.g. GKE, see deploy/terraform/gke).
# Set your e-mail address, apply, then install the chart with
#   --set ingress.tls.enabled=true --set ingress.tls.clusterIssuer=letsencrypt-staging
# and switch to letsencrypt-prod once the staging certificate is issued (staging has generous rate limits).
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-staging
spec:
  acme:
    server: https://acme-staging-v02.api.letsencrypt.org/directory
    email: you@example.com  # expiry notices go here
    privateKeySecretRef: { name: letsencrypt-staging-account }
    solvers:
      - http01:
          ingress: { ingressClassName: nginx }
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: you@example.com
    privateKeySecretRef: { name: letsencrypt-prod-account }
    solvers:
      - http01:
          ingress: { ingressClassName: nginx }
