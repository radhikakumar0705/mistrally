# Redeploys the live demo VM over SSH after CI passes on master, or on demand.
# Does nothing until these repository secrets exist (Settings -> Secrets and variables -> Actions):
#   DEMO_HOST         the VM's public IP or hostname
#   DEMO_USER         SSH user, e.g. ubuntu
#   DEMO_SSH_KEY      private key of a deploy-only key pair (public half in the VM's authorized_keys)
#   DEMO_KNOWN_HOSTS  output of `ssh-keyscan <host>`, so the runner can verify it reached your VM
# The VM is set up once with deploy/demo/setup-vm.sh, and keeps the Groq key in ~/mistrally.secrets.
name: Deploy demo

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [master]
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag or commit to deploy
        default: master

concurrency:
  group: deploy-demo
  cancel-in-progress: false  # never interrupt a deploy halfway

permissions:
  contents: read

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment:
      name: demo
    env:
      HOST: ${{ secrets.DEMO_HOST }}
      REF: ${{ inputs.ref || github.event.workflow_run.head_sha }}
    steps:
      - name: Check configuration
        id: config
        run: |
          if [ -z "$HOST" ]; then
            echo "::notice::DEMO_HOST is not set; skipping the deploy"
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Configure SSH
        if: steps.config.outputs.enabled == 'true'
        env:
          SSH_KEY: ${{ secrets.DEMO_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEMO_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_deploy && chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Deploy
        if: steps.config.outputs.enabled == 'true'
        env:
          USER_NAME: ${{ secrets.DEMO_USER }}
        run: |
          # REF ends up in a remote shell command: allow only characters git refs and SHAs use
          [[ "$REF" =~ ^[A-Za-z0-9._/-]+$ ]] || { echo "::error::Invalid ref: $REF"; exit 1; }
          ssh -i ~/.ssh/id_deploy -o StrictHostKeyChecking=yes "$USER_NAME@$HOST" \
            "cd ~/mistrally && git fetch -q origin && git checkout -q --detach '$REF' && deploy/demo/setup-vm.sh '$REF'"

      - name: Smoke test
        if: steps.config.outputs.enabled == 'true'
        env:
          USER_NAME: ${{ secrets.DEMO_USER }}
        run: |
          site=$(ssh -i ~/.ssh/id_deploy "$USER_NAME@$HOST" "grep '^SITE_ADDRESS=' ~/mistrally/.env | cut -d= -f2")
          curl -fsS --retry 10 --retry-delay 6 --retry-all-errors "https://$site/api/health/ready"
          echo "### Deployed to https://$site" >> "$GITHUB_STEP_SUMMARY"
