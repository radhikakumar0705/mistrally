name: CI

on:
  push:
    branches: [master, main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (lint + tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Cache embedding model
        uses: actions/cache@v4
        with:
          path: ~/.cache/chroma
          key: chroma-onnx-all-MiniLM-L6-v2
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: pytest -q

  frontend:
    name: Frontend (lint + tests + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  manifests:
    name: Compose + Kubernetes manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate docker-compose.yml
        run: cp .env.example .env && sed -i 's/=$/=ci-placeholder/' .env && docker compose config --quiet
      - name: Render and validate Kubernetes manifests
        run: |
          sed 's/=$/=ci-placeholder/' k8s/overlays/local/secrets.env.example > k8s/overlays/local/secrets.env
          kubectl kustomize k8s/overlays/local > rendered.yaml
          docker run --rm -v "$PWD:/work" ghcr.io/yannh/kubeconform:v0.6.7 \
            -strict -summary -kubernetes-version 1.30.0 /work/rendered.yaml

  images:
    name: Docker images
    needs: [backend, frontend, manifests]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        component: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/mistrally-${{ matrix.component }}
          tags: |
            type=sha,format=short
            type=ref,event=branch
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.component }}
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}
