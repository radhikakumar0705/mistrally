{{- if .Values.mysql.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: mysql
  labels: {{- include "mistrally.labels" . | nindent 4 }}
spec:
  clusterIP: None
  selector: {{- include "mistrally.component" (list . "mysql") | nindent 4 }}
  ports:
    - { name: mysql, port: 3306 }
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mysql
  labels: {{- include "mistrally.labels" . | nindent 4 }}
spec:
  serviceName: mysql
  replicas: 1
  selector:
    matchLabels: {{- include "mistrally.component" (list . "mysql") | nindent 6 }}
  template:
    metadata:
      labels: {{- include "mistrally.component" (list . "mysql") | nindent 8 }}
    spec:
      containers:
        - name: mysql
          image: {{ .Values.mysql.image }}
          args: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
          env:
            - { name: MYSQL_DATABASE, value: mistrally }
            - { name: MYSQL_USER, value: mistrally }
            - name: MYSQL_PASSWORD
              valueFrom: { secretKeyRef: { name: {{ include "mistrally.secretName" . }}, key: MYSQL_PASSWORD } }
            - name: MYSQL_ROOT_PASSWORD
              valueFrom: { secretKeyRef: { name: {{ include "mistrally.secretName" . }}, key: MYSQL_ROOT_PASSWORD } }
          ports:
            - { name: mysql, containerPort: 3306 }
          readinessProbe:
            exec:
              command: ["sh", "-c", "mysqladmin ping -h 127.0.0.1 -u root -p\"$MYSQL_ROOT_PASSWORD\" --silent"]
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            tcpSocket: { port: mysql }
            initialDelaySeconds: 60
            periodSeconds: 20
          resources: {{- toYaml .Values.mysql.resources | nindent 12 }}
          volumeMounts:
            - { name: data, mountPath: /var/lib/mysql }
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests: { storage: {{ .Values.mysql.storage }} }
---
{{- end }}
apiVersion: v1
kind: Service
metadata:
  name: chroma
  labels: {{- include "mistrally.labels" . | nindent 4 }}
spec:
  selector: {{- include "mistrally.component" (list . "chroma") | nindent 4 }}
  ports:
    - { name: http, port: 8000, targetPort: http }
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: chroma-data
  labels: {{- include "mistrally.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep  # embeddings survive uninstalling the release
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests: { storage: {{ .Values.chroma.storage }} }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: chroma
  labels: {{- include "mistrally.labels" . | nindent 4 }}
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels: {{- include "mistrally.component" (list . "chroma") | nindent 6 }}
  template:
    metadata:
      labels: {{- include "mistrally.component" (list . "chroma") | nindent 8 }}
    spec:
      # Chroma reads CHROMA_* variables as config; the injected CHROMA_PORT=tcp://... crashes it
      enableServiceLinks: false
      containers:
        - name: chroma
          image: {{ .Values.chroma.image }}
          ports:
            - { name: http, containerPort: 8000 }
          readinessProbe:
            httpGet: { path: /api/v2/heartbeat, port: http }
            periodSeconds: 10
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { memory: 1Gi }
          volumeMounts:
            - { name: data, mountPath: /data }
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: chroma-data }
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  labels: {{- include "mistrally.labels" . | nindent 4 }}
spec:
  selector: {{- include "mistrally.component" (list . "redis") | nindent 4 }}
  ports:
    - { name: redis, port: 6379, targetPort: redis }
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: redis-data
  labels: {{- include "mistrally.labels" . | nindent 4 }}
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests: { storage: {{ .Values.redis.storage }} }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  labels: {{- include "mistrally.labels" . | nindent 4 }}
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels: {{- include "mistrally.component" (list . "redis") | nindent 6 }}
  template:
    metadata:
      labels: {{- include "mistrally.component" (list . "redis") | nindent 8 }}
    spec:
      securityContext: { runAsNonRoot: true, runAsUser: 999, fsGroup: 999 }
      containers:
        - name: redis
          image: {{ .Values.redis.image }}
          args: ["redis-server", "--appendonly", "yes", "--dir", "/data"]
          ports:
            - { name: redis, containerPort: 6379 }
          readinessProbe:
            exec: { command: ["redis-cli", "ping"] }
            periodSeconds: 5
          resources:
            requests: { cpu: 25m, memory: 32Mi }
            limits: { memory: 256Mi }
          volumeMounts:
            - { name: data, mountPath: /data }
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: redis-data }
