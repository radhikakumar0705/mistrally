apiVersion: v1
kind: Service
metadata:
  name: backend
  labels:
    {{- include "sockrat.labels" . | nindent 4 }}
    app.kubernetes.io/name: backend
spec:
  selector: {{- include "sockrat.component" (list . "backend") | nindent 4 }}
  ports:
    - { name: http, port: 5000, targetPort: http }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  labels: {{- include "sockrat.labels" . | nindent 4 }}
spec:
  {{- if not .Values.backend.autoscaling.enabled }}
  replicas: {{ .Values.backend.replicas }}
  {{- end }}
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  selector:
    matchLabels: {{- include "sockrat.component" (list . "backend") | nindent 6 }}
  template:
    metadata:
      labels: {{- include "sockrat.component" (list . "backend") | nindent 8 }}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "5000"
        prometheus.io/path: /metrics
        # roll the pods when configuration changes
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile: { type: RuntimeDefault }
      terminationGracePeriodSeconds: 40  # let in-flight streamed answers finish
      containers:
        - name: backend
          image: {{ include "sockrat.image" (list . "backend") }}
          imagePullPolicy: {{ .Values.images.pullPolicy }}
          ports:
            - { name: http, containerPort: 5000 }
          envFrom:
            - configMapRef: { name: backend-config }
          env: {{- include "sockrat.backendSecretEnv" . | nindent 12 }}
          startupProbe:
            httpGet: { path: /health/live, port: http }
            periodSeconds: 3
            failureThreshold: 30
          readinessProbe:
            httpGet: { path: /health/ready, port: http }
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet: { path: /health/live, port: http }
            periodSeconds: 20
            timeoutSeconds: 3
          resources: {{- toYaml .Values.backend.resources | nindent 12 }}
          securityContext: {{- include "sockrat.containerSecurity" . | nindent 12 }}
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      volumes:
        - { name: tmp, emptyDir: {} }
{{- if .Values.backend.autoscaling.enabled }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: backend
  labels: {{- include "sockrat.labels" . | nindent 4 }}
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: backend }
  minReplicas: {{ .Values.backend.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.backend.autoscaling.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: {{ .Values.backend.autoscaling.targetCPUUtilizationPercentage }} }
{{- end }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: backend
  labels: {{- include "sockrat.labels" . | nindent 4 }}
spec:
  minAvailable: 1
  selector:
    matchLabels: {{- include "sockrat.component" (list . "backend") | nindent 6 }}
