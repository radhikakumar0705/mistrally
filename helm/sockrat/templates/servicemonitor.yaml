{{- if .Values.monitoring.serviceMonitor }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: backend
  labels: {{- include "sockrat.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels: {{- include "sockrat.component" (list . "backend") | nindent 6 }}
  endpoints:
    - port: http
      path: /metrics
      interval: 30s
  namespaceSelector:
    matchNames: [{{ .Release.Namespace }}]
{{- end }}
