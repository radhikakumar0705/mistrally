apiVersion: v1
kind: Service
metadata:
  name: frontend
  labels: {{- include "sockrat.labels" . | nindent 4 }}
spec:
  selector: {{- include "sockrat.component" (list . "frontend") | nindent 4 }}
  ports:
    - { name: http, port: 80, targetPort: http }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  labels: {{- include "sockrat.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.frontend.replicas }}
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  selector:
    matchLabels: {{- include "sockrat.component" (list . "frontend") | nindent 6 }}
  template:
    metadata:
      labels: {{- include "sockrat.component" (list . "frontend") | nindent 8 }}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: frontend
          image: {{ include "sockrat.image" (list . "frontend") }}
          imagePullPolicy: {{ .Values.images.pullPolicy }}
          env:
            # nginx resolves upstreams itself and ignores resolv.conf search domains: use the full name
            - name: BACKEND_HOST
              value: "backend.{{ .Release.Namespace }}.svc.{{ .Values.clusterDomain }}:5000"
          ports:
            - { name: http, containerPort: 8080 }
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 20
          resources: {{- toYaml .Values.frontend.resources | nindent 12 }}
          securityContext: {{- include "sockrat.containerSecurity" . | nindent 12 }}
          # nginx renders its config and keeps its cache and pid file here at startup
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
            - { name: cache, mountPath: /var/cache/nginx }
            - { name: conf, mountPath: /etc/nginx/conf.d }
      volumes:
        - { name: tmp, emptyDir: {} }
        - { name: cache, emptyDir: {} }
        - { name: conf, emptyDir: {} }
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: frontend
  labels: {{- include "sockrat.labels" . | nindent 4 }}
spec:
  minAvailable: 1
  selector:
    matchLabels: {{- include "sockrat.component" (list . "frontend") | nindent 6 }}
