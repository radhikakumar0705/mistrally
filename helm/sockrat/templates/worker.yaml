{{- if .Values.worker.enabled }}
# Processes uploaded documents from the Redis queue (RQ)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  labels: {{- include "sockrat.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.worker.replicas }}
  selector:
    matchLabels: {{- include "sockrat.component" (list . "worker") | nindent 6 }}
  template:
    metadata:
      labels: {{- include "sockrat.component" (list . "worker") | nindent 8 }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile: { type: RuntimeDefault }
      terminationGracePeriodSeconds: 60  # RQ finishes the current job on SIGTERM
      containers:
        - name: worker
          image: {{ include "sockrat.image" (list . "backend") }}
          imagePullPolicy: {{ .Values.images.pullPolicy }}
          command: ["python", "worker.py"]
          envFrom:
            - configMapRef: { name: backend-config }
          env: {{- include "sockrat.backendSecretEnv" . | nindent 12 }}
          resources: {{- toYaml .Values.worker.resources | nindent 12 }}
          securityContext: {{- include "sockrat.containerSecurity" . | nindent 12 }}
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      volumes:
        - { name: tmp, emptyDir: {} }
{{- end }}
