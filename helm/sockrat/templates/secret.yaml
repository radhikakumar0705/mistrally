{{- if not .Values.secrets.existingSecret }}
{{- /* Reuse values from a previous install so upgrades don't rotate passwords and sign everyone out */}}
{{- $existing := (lookup "v1" "Secret" .Release.Namespace "sockrat-secrets").data | default dict }}
apiVersion: v1
kind: Secret
metadata:
  name: sockrat-secrets
  labels: {{- include "sockrat.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep  # never delete credentials together with the release
type: Opaque
data:
  SECRET_KEY: {{ include "sockrat.secretValue" (list .Values.secrets.secretKey $existing "SECRET_KEY") }}
  JWT_SECRET_KEY: {{ include "sockrat.secretValue" (list .Values.secrets.jwtSecretKey $existing "JWT_SECRET_KEY") }}
  MYSQL_PASSWORD: {{ include "sockrat.secretValue" (list .Values.secrets.mysqlPassword $existing "MYSQL_PASSWORD") }}
  MYSQL_ROOT_PASSWORD: {{ include "sockrat.secretValue" (list .Values.secrets.mysqlRootPassword $existing "MYSQL_ROOT_PASSWORD") }}
  SANDBOX_TOKEN: {{ include "sockrat.secretValue" (list .Values.secrets.sandboxToken $existing "SANDBOX_TOKEN") }}
  {{- with .Values.secrets.googleClientId }}
  GOOGLE_CLIENT_ID: {{ . | b64enc }}
  {{- end }}
  {{- with .Values.secrets.googleClientSecret }}
  GOOGLE_CLIENT_SECRET: {{ . | b64enc }}
  {{- end }}
  {{- with .Values.secrets.groqApiKey }}
  GROQ_API_KEY: {{ . | b64enc }}
  {{- end }}
{{- end }}
