# Mistrally: full stack in Docker.
#   cp .env.example .env    (fill in the secrets)
#   docker compose up --build
#   open http://localhost:8090
#
# By default the backend uses the Ollama running on your machine (fastest; uses your GPU).
# To run Ollama in a container too:  docker compose --profile ollama up --build
# and set OLLAMA_URL=http://ollama:11434 in .env.
#
# Monitoring (Prometheus :9090, Grafana :3001, Jaeger :16686):  docker compose --profile monitoring up
# and set OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4317 in .env to send traces.

name: mistrally

x-backend-env: &backend-env
  SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env}
  JWT_SECRET_KEY: ${JWT_SECRET_KEY:?Set JWT_SECRET_KEY in .env}
  PUBLIC_URL: ${PUBLIC_URL:-http://localhost:8090}
  COOKIE_SECURE: ${COOKIE_SECURE:-false}
  GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
  GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
  DB_HOST: mysql
  DB_PORT: "3306"
  DB_NAME: mistrally
  DB_USER: mistrally
  DB_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
  CHROMA_HOST: chroma
  CHROMA_PORT: "8000"
  LLM_PROVIDER: ${LLM_PROVIDER:-ollama}
  LLM_MODEL: ${LLM_MODEL:-}
  LLM_MODELS: ${LLM_MODELS:-}
  GROQ_API_KEY: ${GROQ_API_KEY:-}
  OLLAMA_URL: ${OLLAMA_URL:-http://host.docker.internal:11434}
  OLLAMA_MODEL: ${OLLAMA_MODEL:-mistral}
  RATELIMIT_STORAGE_URI: redis://redis:6379/0
  TASK_QUEUE_URL: redis://redis:6379/1
  SANDBOX_URL: http://sandbox:8080
  SANDBOX_TOKEN: ${SANDBOX_TOKEN:?Set SANDBOX_TOKEN in .env}
  PROXY_FIX_HOPS: "1"
  LOG_LEVEL: INFO
  OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}

services:
  mysql:
    image: mysql:8.0.40
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: mistrally
      MYSQL_USER: mistrally
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 30

  chroma:
    image: chromadb/chroma:1.3.5
    restart: unless-stopped
    volumes:
      - chroma-data:/data

  redis:
    image: redis:7.4.1-alpine
    restart: unless-stopped
    # Rate-limit counters (db 0) and the document queue (db 1); append-only so queued jobs survive restarts
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # One-shot job: apply database migrations before the API starts
  migrate:
    build: ./backend
    image: mistrally-backend:local
    command: ["flask", "--app", "wsgi", "db", "upgrade"]
    environment: *backend-env
    depends_on:
      mysql:
        condition: service_healthy
    restart: "no"

  backend:
    image: mistrally-backend:local
    restart: unless-stopped
    environment:
      <<: *backend-env
      WEB_CONCURRENCY: "2"
    networks: [default, sandbox]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      chroma:
        condition: service_started

  # Processes uploaded documents from the Redis queue
  worker:
    image: mistrally-backend:local
    restart: unless-stopped
    command: ["python", "worker.py"]
    environment: *backend-env
    healthcheck:
      test: ["CMD", "python", "-c", "import os, redis; redis.Redis.from_url(os.environ['TASK_QUEUE_URL']).ping()"]
      interval: 30s
      timeout: 5s
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  # Runs Python snippets for the "Run" button. Its network is internal: no internet, and the
  # databases aren't on it, so code can only reach the API that called it.
  sandbox:
    build: ./sandbox
    image: mistrally-sandbox:local
    restart: unless-stopped
    environment:
      SANDBOX_TOKEN: ${SANDBOX_TOKEN:?Set SANDBOX_TOKEN in .env}
    networks: [sandbox]
    read_only: true
    tmpfs:
      - /tmp:size=64m
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 512m
    cpus: 1
    pids_limit: 64

  frontend:
    build: ./frontend
    image: mistrally-frontend:local
    restart: unless-stopped
    environment:
      BACKEND_HOST: backend:5000
    ports:
      - "127.0.0.1:${MISTRALLY_PORT:-8090}:8080"
    depends_on:
      backend:
        condition: service_healthy

  ollama:
    profiles: ["ollama"]
    image: ollama/ollama:0.12.6
    restart: unless-stopped
    volumes:
      - ollama-data:/root/.ollama

  ollama-pull:
    profiles: ["ollama"]
    image: ollama/ollama:0.12.6
    environment:
      OLLAMA_HOST: ollama:11434
    entrypoint: ["ollama", "pull", "${OLLAMA_MODEL:-mistral}"]
    depends_on:
      - ollama
    restart: "no"

  prometheus:
    profiles: ["monitoring"]
    image: prom/prometheus:v2.55.1
    restart: unless-stopped
    volumes:
      - ./monitoring/prometheus:/etc/prometheus:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"

  grafana:
    profiles: ["monitoring"]
    image: grafana/grafana:11.3.1
    restart: unless-stopped
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/mistrally-overview.json
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "127.0.0.1:3001:3000"
    depends_on:
      - prometheus

  jaeger:
    profiles: ["monitoring"]
    image: jaegertracing/all-in-one:1.62.0
    restart: unless-stopped
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "127.0.0.1:16686:16686"

networks:
  default:
  sandbox:
    internal: true

volumes:
  prometheus-data:
  redis-data:
  mysql-data:
  chroma-data:
  ollama-data:
