# Local cluster (Docker Desktop Kubernetes or kind) using images built on this machine.
#   cp k8s/overlays/local/secrets.env.example k8s/overlays/local/secrets.env   (fill it in)
#   kubectl apply -k k8s/overlays/local
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

# Uncomment to run Ollama inside the cluster instead of using the host's
# components:
#   - ../../components/ollama

# The hash suffix on the generated Secret rolls the pods whenever a secret changes
secretGenerator:
  - name: sockrat-secrets
    namespace: sockrat
    envs:
      - secrets.env

images:
  - name: sockrat-backend
    newName: sockrat-backend
    newTag: local
  - name: sockrat-frontend
    newName: sockrat-frontend
    newTag: local
  - name: sockrat-sandbox
    newName: sockrat-sandbox
    newTag: local
