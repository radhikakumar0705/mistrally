# Least-privilege traffic rules. They are enforced on clusters whose network plugin supports
# NetworkPolicy (e.g. Calico or Cilium); Docker Desktop's built-in cluster accepts but ignores them.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
spec:
  podSelector: {}
  policyTypes: ["Ingress"]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: frontend-from-anywhere
spec:
  podSelector:
    matchLabels: { app.kubernetes.io/name: frontend }
  policyTypes: ["Ingress"]
  ingress:
    - ports: [{ port: 8080 }]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: backend-from-frontend
spec:
  podSelector:
    matchLabels: { app.kubernetes.io/name: backend }
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchLabels: { app.kubernetes.io/name: frontend }
      ports: [{ port: 5000 }]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: data-stores-from-backend
spec:
  podSelector:
    matchExpressions:
      - { key: app.kubernetes.io/name, operator: In, values: [mysql, chroma, redis] }
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - { key: app.kubernetes.io/name, operator: In, values: [backend, migrate] }
