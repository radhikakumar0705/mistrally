apiVersion: v1
kind: Service
metadata:
  name: mysql
  labels: { app.kubernetes.io/name: mysql }
spec:
  clusterIP: None  # headless service for the StatefulSet
  selector: { app.kubernetes.io/name: mysql }
  ports:
    - name: mysql
      port: 3306
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mysql
  labels: { app.kubernetes.io/name: mysql, app.kubernetes.io/part-of: sockrat }
spec:
  serviceName: mysql
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: mysql }
  template:
    metadata:
      labels: { app.kubernetes.io/name: mysql, app.kubernetes.io/part-of: sockrat }
    spec:
      containers:
        - name: mysql
          image: mysql:8.0.40
          args: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
          env:
            - { name: MYSQL_DATABASE, value: sockrat }
            - { name: MYSQL_USER, value: sockrat }
            - name: MYSQL_PASSWORD
              valueFrom: { secretKeyRef: { name: sockrat-secrets, key: MYSQL_PASSWORD } }
            - name: MYSQL_ROOT_PASSWORD
              valueFrom: { secretKeyRef: { name: sockrat-secrets, key: MYSQL_ROOT_PASSWORD } }
          ports:
            - { name: mysql, containerPort: 3306 }
          readinessProbe:
            exec:
              command: ["sh", "-c", "mysqladmin ping -h 127.0.0.1 -u root -p\"$MYSQL_ROOT_PASSWORD\" --silent"]
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            tcpSocket: { port: mysql }
            initialDelaySeconds: 60
            periodSeconds: 20
          resources:
            requests: { cpu: 100m, memory: 512Mi }
            limits: { memory: 1Gi }
          volumeMounts:
            - { name: data, mountPath: /var/lib/mysql }
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests: { storage: 5Gi }
