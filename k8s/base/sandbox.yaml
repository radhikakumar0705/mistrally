# Runs Python snippets for the "Run" button. Only the API may call it, and it may not open any
# connection itself (see the NetworkPolicies below); the container is non-root, read-only and capped.
apiVersion: v1
kind: Service
metadata:
  name: sandbox
  labels: { app.kubernetes.io/name: sandbox }
spec:
  selector: { app.kubernetes.io/name: sandbox }
  ports:
    - { name: http, port: 8080, targetPort: http }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sandbox
  labels: { app.kubernetes.io/name: sandbox }
spec:
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: sandbox }
  template:
    metadata:
      labels: { app.kubernetes.io/name: sandbox }
    spec:
      automountServiceAccountToken: false  # executed code gets no Kubernetes API credentials
      enableServiceLinks: false            # nor environment variables describing other services
      securityContext:
        runAsNonRoot: true
        runAsUser: 10002
        runAsGroup: 10002
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: sandbox
          image: mistrally-sandbox
          env:
            - name: SANDBOX_TOKEN
              valueFrom: { secretKeyRef: { name: mistrally-secrets, key: SANDBOX_TOKEN } }
          ports:
            - { name: http, containerPort: 8080 }
          readinessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 20
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: "1", memory: 512Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: tmp
          emptyDir: { medium: Memory, sizeLimit: 64Mi }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: sandbox-isolation
spec:
  podSelector:
    matchLabels: { app.kubernetes.io/name: sandbox }
  policyTypes: ["Ingress", "Egress"]
  ingress:
    - from:
        - podSelector:
            matchLabels: { app.kubernetes.io/name: backend }
      ports: [{ port: 8080 }]
  egress: []  # no outbound connections at all: not the internet, not DNS, not other pods
