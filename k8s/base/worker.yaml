# Processes uploaded documents from the Redis queue (RQ)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  labels: { app.kubernetes.io/name: worker }
spec:
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: worker }
  template:
    metadata:
      labels: { app.kubernetes.io/name: worker }
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile: { type: RuntimeDefault }
      terminationGracePeriodSeconds: 60  # RQ finishes the current job on SIGTERM
      containers:
        - name: worker
          image: sockrat-backend
          command: ["python", "worker.py"]
          envFrom:
            - configMapRef: { name: backend-config }
          env:
            - name: DB_PASSWORD
              valueFrom: { secretKeyRef: { name: sockrat-secrets, key: MYSQL_PASSWORD } }
            - name: SECRET_KEY
              valueFrom: { secretKeyRef: { name: sockrat-secrets, key: SECRET_KEY } }
            - name: JWT_SECRET_KEY
              valueFrom: { secretKeyRef: { name: sockrat-secrets, key: JWT_SECRET_KEY } }
          resources:
            requests: { cpu: 100m, memory: 512Mi }
            limits: { memory: 1536Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      volumes:
        - { name: tmp, emptyDir: {} }
