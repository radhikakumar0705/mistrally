apiVersion: v1
kind: Service
metadata:
  name: chroma
  labels: { app.kubernetes.io/name: chroma }
spec:
  selector: { app.kubernetes.io/name: chroma }
  ports:
    - { name: http, port: 8000, targetPort: http }
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: chroma-data
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests: { storage: 2Gi }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: chroma
  labels: { app.kubernetes.io/name: chroma, app.kubernetes.io/part-of: mistrally }
spec:
  replicas: 1
  strategy: { type: Recreate }  # the volume can only be mounted by one pod
  selector:
    matchLabels: { app.kubernetes.io/name: chroma }
  template:
    metadata:
      labels: { app.kubernetes.io/name: chroma, app.kubernetes.io/part-of: mistrally }
    spec:
      containers:
        - name: chroma
          image: chromadb/chroma:1.3.5
          ports:
            - { name: http, containerPort: 8000 }
          readinessProbe:
            httpGet: { path: /api/v2/heartbeat, port: http }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /api/v2/heartbeat, port: http }
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { memory: 1Gi }
          volumeMounts:
            - { name: data, mountPath: /data }
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: chroma-data }
