apiVersion: v1
kind: Service
metadata:
  name: ollama
  labels: { app.kubernetes.io/name: ollama }
spec:
  selector: { app.kubernetes.io/name: ollama }
  ports:
    - { name: http, port: 11434, targetPort: http }
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ollama-models
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests: { storage: 20Gi }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ollama
  labels: { app.kubernetes.io/name: ollama }
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels: { app.kubernetes.io/name: ollama }
  template:
    metadata:
      labels: { app.kubernetes.io/name: ollama }
    spec:
      containers:
        - name: ollama
          image: ollama/ollama:0.12.6
          ports:
            - { name: http, containerPort: 11434 }
          readinessProbe:
            httpGet: { path: /api/tags, port: http }
            periodSeconds: 10
          resources:
            requests: { cpu: "1", memory: 6Gi }
            limits: { memory: 10Gi }
          volumeMounts:
            - { name: models, mountPath: /root/.ollama }
      volumes:
        - name: models
          persistentVolumeClaim: { claimName: ollama-models }
---
# Downloads the model into the shared volume once Ollama is up
apiVersion: batch/v1
kind: Job
metadata:
  name: ollama-pull
spec:
  backoffLimit: 20
  ttlSecondsAfterFinished: 3600
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: pull
          image: ollama/ollama:0.12.6
          command: ["ollama", "pull", "mistral"]
          env:
            - { name: OLLAMA_HOST, value: "ollama:11434" }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ollama-from-backend
spec:
  podSelector:
    matchLabels: { app.kubernetes.io/name: ollama }
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - { key: job-name, operator: In, values: [ollama-pull] }
        - podSelector:
            matchLabels: { app.kubernetes.io/name: backend }
